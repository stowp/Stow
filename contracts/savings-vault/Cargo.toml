[package]
name = "savings-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Stow — non-custodial savings vault (flexible, locked, goal, group, group-split) on Soroban"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0.0"
# Sibling contract that mints interest-boost NFTs at savings milestones.
# Used for the `BoostNftClient` and `Tier` type in `src/boost.rs`.
boost-nft = { path = "../boost-nft" }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
proptest = "1"
# Pin ed25519-dalek: soroban-env-host's testutils feature declares an
# unbounded ">=2.0.0" requirement, which otherwise lets Cargo resolve the
# semver-incompatible 3.x (whose rand_core version doesn't implement the
# CryptoRng trait soroban-env-host's ChaCha20-based test PRNG needs).
ed25519-dalek = "=2.2.0"

[features]
testutils = ["soroban-sdk/testutils"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
